[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevselector"
version = "0.1.0"
description = "Portable preparation and sparse CPU premise selection for Lean"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
jevselector = "jevselector.cli:main"

[tool.setuptools.packages.find]
include = ["jevselector*"]
